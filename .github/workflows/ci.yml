name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: lint, typecheck, build
    runs-on: ubuntu-latest
    env:
      # Build needs these set; values don't need to point at a live DB for
      # the checks to pass (no route reaches the DB at build time).
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      # >= 32 chars for iron-session
      SESSION_SECRET: ci-secret-ci-secret-ci-secret-ci-secret!

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
